name = "claude"
version = "0.3.0"
protocol = 1
description = "Claude Code with asterism's status hooks"
permissions = ["exec:claude"]

[backend]
command = ["./asterism-plugin-claude"]

[[provides.agent]]
id = "claude"
display_name = "Claude Code"
binary = "claude"
launch = "backend"
waiting_patterns = ["Do you want to", "❯ 1. Yes"]
settings = ["args", "mcp", "hooks", "hibernate"]
reserved_args = ["--", "--settings", "--mcp-config", "--resume", "-r", "--continue", "-c", "--print", "-p", "--settings=", "--mcp-config=", "--resume=", "--name", "-n", "--name="]

[[settings]]
key = "trust_workspaces"
title = "Trust task worktrees"
type = "bool"
default = false
description = "Skip Claude's folder trust prompt in new task worktrees. The repository's Claude settings, hooks and MCP servers then load without asking."

[[settings]]
key = "name_sessions"
title = "Name sessions after the task"
type = "bool"
default = true
description = "Start Claude with the task's title as session name, prefixed with the issue key when the task has one. It shows in /resume and the terminal title."
