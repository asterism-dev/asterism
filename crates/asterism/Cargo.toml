[package]
name = "asterism"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "asterism_core"
path = "src/lib.rs"

[[bin]]
name = "asterismd"
path = "src/bin/asterismd.rs"

[[bin]]
name = "asterism"
path = "src/bin/asterism/main.rs"

[[bin]]
name = "asterism-plugin-github"
path = "src/bin/asterism-plugin-github/main.rs"

[[bin]]
name = "asterism-plugin-claude"
path = "src/bin/asterism-plugin-claude/main.rs"

[[bin]]
name = "asterism-plugin-linear"
path = "src/bin/asterism-plugin-linear/main.rs"

[dependencies]
asterism-plugin = { path = "../asterism-plugin" }
asterism-proto = { path = "../asterism-proto" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
if-addrs = "0.13"
clap = { version = "4", features = ["derive"] }
gethostname = "0.5"
humantime = "2"
libc = "0.2"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
vt100 = "0.15"

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
