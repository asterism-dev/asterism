[package]
name = "asterism"
version = "0.1.0"
edition = "2021"

[lib]
name = "asterism_core"
path = "src/lib.rs"

[[bin]]
name = "asterismd"
path = "src/bin/asterismd.rs"

[[bin]]
name = "asterism"
path = "src/bin/asterism/main.rs"

[dependencies]
asterism-proto = { path = "../asterism-proto" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
